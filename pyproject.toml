[project]
name = "pubmed-paper-fetcher-cli"
version = "0.2.2"
description = "Fetch PubMed research papers with industry affiliations."
readme = "README.md"
license = "MIT"
authors = [{name = "hritxx", email = "hriteekroy1869@gmail.com"}]

urls = { "repository" = "https://github.com/hritxx/pubmed-paper-fetcher" }
dependencies = [
    "requests>=2.32.3",
    "pandas>=2.2.3",
    "lxml>=5.0.0",
]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"

[tool.poetry.scripts]
get-papers-list = "pubmed_paper_fetcher_cli.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"